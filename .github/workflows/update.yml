name: 更新熱門時段

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hot-slots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取時段
        run: node scripts/fetch.mjs
      - name: Commit 變動
        run: |
          git config user.name "hot-slots-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -I '"updated"' -- docs/slots.json; then
            echo "時段無變化"
          else
            git add docs/slots.json
            git commit -m "更新熱門時段"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
