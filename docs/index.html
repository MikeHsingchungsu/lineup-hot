<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熱門時段臨時釋出｜A LINEUP LAB</title>
<meta property="og:title" content="🔥 熱門時段臨時釋出｜A LINEUP LAB">
<meta property="og:description" content="平日 14:30–21:30 空檔即時更新，點了直接預約">
<style>
  :root { --g:#38B672; --gd:#2a8f59; --ink:#1d1d1f; --mute:#8a8a8e; --bg:#f5f6f4; --line:#e6e7e4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  header { background:var(--ink); color:#fff; padding:22px 18px 18px; }
  .brand { font-size:12px; letter-spacing:.14em; color:var(--g); font-weight:700; }
  h1 { font-size:24px; margin-top:6px; line-height:1.25; }
  .sub { font-size:13px; color:#c7c7cc; margin-top:6px; }
  .upd { display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:12px; color:#c7c7cc; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--g); box-shadow:0 0 0 3px rgba(56,182,114,.25); }
  main { max-width:560px; margin:0 auto; padding:14px 14px 40px; }
  .day { margin-top:18px; }
  .day h2 { font-size:15px; font-weight:700; padding:0 4px 8px; display:flex; justify-content:space-between; align-items:baseline; }
  .day h2 small { font-size:12px; color:var(--mute); font-weight:500; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .time { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
  .tag { font-size:12px; font-weight:700; color:var(--gd); background:#e8f6ee; padding:4px 10px; border-radius:999px; }
  .btns { display:grid; gap:8px; margin-top:12px; }
  .btns.n3 { grid-template-columns:repeat(3,1fr); }
  .btns.n1 { grid-template-columns:1fr; }
  .btn { display:block; text-align:center; text-decoration:none; background:var(--g); color:#fff; font-weight:700; font-size:14px; padding:11px 4px; border-radius:10px; }
  .btn:active { background:var(--gd); }
  .hint { font-size:11px; color:var(--mute); margin-top:8px; }
  .none { font-size:13px; color:var(--mute); padding:12px 4px; }
  .empty { background:#fff; border:1px dashed var(--line); border-radius:14px; padding:28px 18px; text-align:center; margin-top:18px; }
  .empty b { display:block; font-size:16px; margin-bottom:6px; }
  .empty p { font-size:13px; color:var(--mute); }
  .line { display:inline-block; margin-top:14px; background:#06C755; color:#fff; text-decoration:none; font-weight:700; padding:10px 18px; border-radius:999px; font-size:14px; }
  footer { text-align:center; font-size:12px; color:var(--mute); padding:8px 0 28px; }
  footer a { color:var(--gd); }
</style>
</head>
<body>
<header>
  <div class="brand">A LINEUP LAB</div>
  <h1>🔥 熱門時段臨時釋出</h1>
  <div class="sub">平日 14:30–21:30 的空檔，每 10 分鐘自動更新</div>
  <div class="upd"><span class="dot"></span><span id="upd">載入中…</span></div>
</header>
<main id="list"></main>
<footer>空檔以預約頁顯示為準，先訂先得<br><a href="https://line.me/R/ti/p/%40a_lineup_lab">官方 LINE @a_lineup_lab</a></footer>

<script>
const WD = ['日','一','二','三','四','五','六'];
const LINE_URL = 'https://line.me/R/ti/p/%40a_lineup_lab';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function nowTaipei() {
  const s = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Taipei' });
  return { date: s.slice(0,10), time: s.slice(11,16) };
}

function render(data) {
  document.getElementById('upd').textContent = '最後更新 ' + data.updated.slice(5).replace('-', '/');
  const now = nowTaipei();
  const list = document.getElementById('list');
  let total = 0, html = '';
  for (const d of data.days) {
    const slots = d.slots.filter(s => d.date > now.date || (d.date === now.date && s.start > now.time));
    total += slots.length;
    const [, m, dd] = d.date.split('-');
    const label = d.date === now.date ? '今天' : '';
    html += `<section class="day"><h2>${+m}/${+dd}（${WD[d.weekday]}）<small>${label}</small></h2>`;
    if (!slots.length) { html += `<div class="none">此日熱門時段已滿</div>`; }
    for (const s of slots) {
      const n = s.links.length;
      html += `<div class="card"><div class="row"><span class="time">${esc(s.start)}–${esc(s.end)}</span><span class="tag">${esc(s.name)}</span></div>
        <div class="btns n${n === 1 ? 1 : 3}">${s.links.map(l => `<a class="btn" href="${esc(l.url)}">${n === 1 ? esc(l.label) + '・立即預約' : esc(l.label)}</a>`).join('')}</div>
        ${n > 1 ? '<div class="hint">依進場人數選擇方案</div>' : ''}</div>`;
    }
    html += `</section>`;
  }
  if (!total) {
    html = `<div class="empty"><b>目前熱門時段都已預約滿</b><p>有人取消或臨時釋出時會出現在這裡，<br>也歡迎加官方 LINE 詢問。</p><a class="line" href="${LINE_URL}">加入官方 LINE</a></div>`;
  }
  list.innerHTML = html;
}

async function load() {
  try {
    const r = await fetch('slots.json?t=' + Date.now(), { cache: 'no-store' });
    render(await r.json());
  } catch (e) {
    document.getElementById('upd').textContent = '暫時無法載入，請稍後再試';
  }
}
load();
setInterval(load, 120000);
</script>
</body>
</html>
